<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 多模态 2D 转 3D 场景生成</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; background-color: #f4f4f9; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .flex-row { display: flex; gap: 20px; margin-top: 20px; }
        .panel { flex: 1; border: 1px solid #eee; border-radius: 8px; padding: 10px; }
        img { max-width: 100%; border-radius: 8px; }
        iframe { width: 100%; height: 400px; border: none; border-radius: 8px; background: #111; }
        .loading { color: #007bff; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>AI 多模态 2D 转 3D 场景生成</h2>
        <p>上传一张图片，YOLO 识物，前端动态渲染 3D 场景。</p >
        <input type="file" id="imageInput" accept="image/*">
        <button id="uploadBtn">上传并生成 3D 场景</button>
        
        <div id="loading" class="loading" style="display:none;">AI 正在识图并渲染 3D 场景，请稍候...</div>

        <div class="flex-row" id="resultArea" style="display:none; margin-top: 20px;">
            <div class="panel">
                <h3>📸 YOLO 识别结果</h3>
                <img id="resultImage" src="" alt="检测结果">
            </div>
            <div class="panel">
                <h3>🧊 3D 场景重建</h3>
                <iframe id="scene3dFrame"></iframe>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('uploadBtn').addEventListener('click', uploadImage);

        async function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            if (!file) { alert("请先选择一张图片"); return; }

            const formData = new FormData();
            formData.append('image', file);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultArea').style.display = 'none';

            try {
                const response = await fetch('/detect', { method: 'POST', body: formData });
                const data = await response.json();
                
                const resultImg = document.getElementById('resultImage');
                if (resultImg) {
                    resultImg.src = data.image;
                } else {
                    alert("前端错误：找不到 resultImage 标签");
                    return;
                }

                const objectsData = data.objects_data || [];

                const sceneCode = `
                <!DOCTYPE html>
                <html>
                <head><style>body { margin: 0; overflow: hidden; background: #111; }</style></head>
                <body>
                    <script src="/three.min.js"><\/script>
                    <script src="/OrbitControls.js"><\/script>
                    <script>
                        const scene = new THREE.Scene();
                        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                        camera.position.set(5, 5, 5);
                        const renderer = new THREE.WebGLRenderer({ antialias: true });
                        renderer.setSize(window.innerWidth, window.innerHeight);
                        document.body.appendChild(renderer.domElement);
                        const controls = new THREE.OrbitControls(camera, renderer.domElement);
                        controls.enableDamping = true;
                        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
                        dirLight.position.set(5, 10, 7); scene.add(dirLight);
                        
                        const shapeMap = {
                            'person': { type: 'cylinder', color: 0xFFCC00, radius: 0.3, height: 1.8 },
                            'car': { type: 'box', color: 0x0000FF, width: 1.2, height: 0.6, depth: 2.2 },
                            'chair': { type: 'group', color: 0x8B4513 },
                            'default': { type: 'box', color: 0x44AAFF, width: 0.8, height: 0.8, depth: 0.8 }
                        };

                        try {
                            const objects = ${JSON.stringify(objectsData)};
                            objects.forEach(obj => {
                                const name = obj.name ? obj.name.toLowerCase() : 'default';
                                const shape = shapeMap[name] || shapeMap['default'];
                                const posX = obj.x || 0, posY = obj.y || 0.5, posZ = obj.z || 0;
                                if (shape.type === 'group' && name === 'chair') {
                                    const seat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.2, 1.2), new THREE.MeshPhongMaterial({color: 0x8B4513}));
                                    seat.position.set(posX, 0.5, posZ); scene.add(seat);
                                    const back = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 0.2), new THREE.MeshPhongMaterial({color: 0x8B4513}));
                                    back.position.set(posX, 1.1, posZ - 0.5); scene.add(back);
                                } else {
                                    let geometry;
                                    if (shape.type === 'cylinder') geometry = new THREE.CylinderGeometry(shape.radius, shape.radius, shape.height, 16);
                                    else geometry = new THREE.BoxGeometry(shape.width, shape.height, shape.depth);
                                    const mesh = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ color: shape.color }));
                                    mesh.position.set(posX, posY, posZ); scene.add(mesh);
                                }
                            });
                        } catch(e) { console.error(e); }
                        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
                        animate();
                    <\/script>
                </body></html>`;
                document.getElementById('scene3dFrame').srcdoc = sceneCode;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('resultArea').style.display = 'flex';
            } catch (error) {
                alert("请求出错: " + error);
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
